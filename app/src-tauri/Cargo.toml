[package]
name = "choren"
version = "0.1.0"
description = "Choren studio for Choregraphe-compatible projects and virtual robots"
authors = ["yudai"]
edition = "2024"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"


choren-core = { path = "../../crates/choren-core" }
serde = { version = "1", features = ["derive"] }
choren-qi = { path = "../../crates/choren-qi" }
choren-robot = { path = "../../crates/choren-robot" }
choren-naoqi = { path = "../../crates/choren-naoqi" }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "rt"] }
russh = { version = "0.64", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3"

[dev-dependencies]
tokio = { version = "1", features = ["process", "macros", "rt-multi-thread"] }
