# Builds signed, notarized macOS installers and attaches them to a draft GitHub release, with
# signed update bundles and the latest.json that installed apps check (once published).
# Push a tag matching app/src-tauri/tauri.conf.json's version (v0.1.0), or run it by hand.
# Setup: the signing and notarization secrets it reads are the secrets.* entries below.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # The update signing key is an environment secret.
    environment: Tauri Development
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        if: github.ref_type == 'tag'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./app/src-tauri/tauri.conf.json').version")"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: v__VERSION__
          releaseName: Choren __VERSION__
          releaseBody: Download the .dmg for your Mac (aarch64 = Apple silicon, x64 = Intel).
          releaseDraft: true
          uploadUpdaterJson: true
          # `app` produces the signed .app.tar.gz the updater installs.
          args: --target ${{ matrix.target }} --bundles app,dmg
