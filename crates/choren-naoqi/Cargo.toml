[package]
name = "choren-naoqi"
description = "Choren's virtual robot: kinematic simulator, simulated NAOqi services and behavior runtime"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
choren-core = { path = "../choren-core" }
choren-qi = { path = "../choren-qi" }
choren-robot = { path = "../choren-robot" }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "io-util", "signal"] }
